    <script>
      /* Last saved brand color (lib/brandColor.js), applied before the first paint. */
      try {
        var saved = JSON.parse(localStorage.getItem('brand-color') || 'null');
        if (saved && /^#[0-9a-f]{6}$/i.test(saved.brand)) {
          document.documentElement.style.setProperty('--color-brand-color', saved.brand);
          document.documentElement.style.setProperty('--color-on-brand', saved.onBrand);
          if (saved.cursor) document.documentElement.style.setProperty('--cursor-arrow', saved.cursor);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
